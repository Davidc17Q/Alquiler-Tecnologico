# Orquestación híbrida: monolito Django + microservicio Flask + API Gateway + Celery
services:
  django:
    build: .
    container_name: alquiler_django
    command: ["/app/scripts/docker-entrypoint.sh"]
    env_file:
      - .env
    environment:
      # Sobrescribe .env: misma BD compartida con pagos_service (volumen sqlite_data)
      DATABASE_URL: sqlite:////data/db.sqlite3
      SQLITE_PATH: /data/db.sqlite3
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - sqlite_data:/data
    expose:
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
    networks:
      - alquiler_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/info/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  flask_service:
    build: ./flask_service
    container_name: alquiler_flask
    environment:
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - sqlite_data:/data
    depends_on:
      django:
        condition: service_healthy
    expose:
      - "5000"
    ports:
      - "5000:5000"
    networks:
      - alquiler_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pagos_service:
    build: ./microservices/pagos_service
    container_name: alquiler_pagos
    environment:
      SQLITE_PATH: /data/db.sqlite3
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@techrent.local}
    volumes:
      - sqlite_data:/data
    depends_on:
      django:
        condition: service_healthy
    expose:
      - "5000"
    ports:
      - "5001:5000"
    networks:
      - alquiler_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: alquiler_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      django:
        condition: service_healthy
      flask_service:
        condition: service_healthy
      pagos_service:
        condition: service_healthy
    networks:
      - alquiler_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: alquiler_redis
    ports:
      - "6379:6379"
    networks:
      - alquiler_net
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: alquiler_celery
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/db.sqlite3
      SQLITE_PATH: /data/db.sqlite3
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - sqlite_data:/data
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - alquiler_net
    restart: unless-stopped

networks:
  alquiler_net:
    driver: bridge

volumes:
  sqlite_data:
