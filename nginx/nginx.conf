# API Gateway — Strangler Pattern
# /api/equipos/  → microservicio Flask
# resto de rutas → monolito Django

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream django_upstream {
        server django:8000;
    }

    upstream flask_upstream {
        server flask_service:5000;
    }

    upstream pagos_upstream {
        server pagos_service:5000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 10M;

        # Microservicio Flask — consulta de equipos disponibles (Strangler)
        location /api/equipos/ {
            proxy_pass http://flask_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Microservicio Flask — pagos (Strangler /api/v2 → /pagos/)
        location /api/v2/ {
            rewrite ^/api/v2/(.*) /$1 break;
            proxy_pass http://pagos_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Monolito Django — API REST, admin, frontend y demás rutas
        location / {
            proxy_pass http://django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
