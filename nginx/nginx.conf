# API Gateway — Strangler Pattern
# /api/equipos/  → microservicio Flask
# resto de rutas → monolito Django

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # DNS embebido de Docker: re-resuelve IPs al recrear contenedores.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        server_name _;
        client_max_body_size 10M;

        # Microservicio Flask — consulta de equipos disponibles (Strangler)
        location /api/equipos/ {
            set $upstream_flask flask_service:5000;
            proxy_pass http://$upstream_flask;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Microservicio de pagos (Strangler /api/v2 → raíz del MS)
        location /api/v2/ {
            set $upstream_pagos pagos_service:5000;
            rewrite ^/api/v2/(.*) /$1 break;
            proxy_pass http://$upstream_pagos;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Monolito Django — API REST, admin, frontend y demás rutas
        location / {
            set $upstream_django django:8000;
            proxy_pass http://$upstream_django;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
