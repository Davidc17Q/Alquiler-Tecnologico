<!-- Pantalla de acceso — registro o inicio de sesión -->
<div id="auth-gate" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/95 backdrop-blur-sm">
  <div class="w-full max-w-md glass-card p-8 space-y-6 fade-in">
    <div class="text-center space-y-2">
      <div class="logo-glow h-14 w-14 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center font-bold text-slate-950 text-lg mx-auto">TR</div>
      <h2 class="text-2xl font-bold tracking-tight">Bienvenido a TechRent</h2>
      <p class="text-sm text-slate-400">Inicia sesión o crea tu cuenta para alquilar equipos</p>
      <p class="text-[11px] text-purple-400/80">Vendedores: usa tu correo corporativo (@techrent.com)</p>
    </div>

    <div class="flex rounded-xl bg-slate-900/80 p-1 border border-slate-800">
      <button type="button" id="auth-tab-login" class="auth-tab flex-1 py-2 text-sm font-medium rounded-lg text-cyan-300 bg-cyan-500/10">Iniciar sesión</button>
      <button type="button" id="auth-tab-register" class="auth-tab flex-1 py-2 text-sm font-medium rounded-lg text-slate-400">Registrarse</button>
    </div>

    <form id="form-login" class="space-y-4">
      <div class="field-group">
        <input id="login-email" type="email" placeholder=" " required autocomplete="email" />
        <label for="login-email">Correo electrónico</label>
      </div>
      <button type="submit" class="btn-primary w-full py-3 rounded-xl text-sm font-semibold text-slate-950">Entrar</button>
    </form>

    <form id="form-register" class="space-y-4 hidden">
      <div class="field-group">
        <input id="register-nombre" type="text" placeholder=" " required autocomplete="name" />
        <label for="register-nombre">Nombre completo</label>
      </div>
      <div class="field-group">
        <input id="register-email" type="email" placeholder=" " required autocomplete="email" />
        <label for="register-email">Correo electrónico</label>
      </div>
      <button type="submit" class="btn-primary w-full py-3 rounded-xl text-sm font-semibold text-slate-950">Crear cuenta</button>
    </form>
  </div>
</div>
